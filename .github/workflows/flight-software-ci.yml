# SMART-QSO Flight Software CI Pipeline
#
# Continuous Integration workflow for flight software validation
# Following NASA NPR 7150.2 software engineering requirements
#
# Runs on every push and pull request to verify:
# - Build success with warnings as errors
# - Static analysis (cppcheck)
# - Unit test execution
# - Code coverage reporting

name: Flight Software CI (Extended)

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
    paths:
      - 'software/flight/**'
      - '.github/workflows/flight-software-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'software/flight/**'
      - '.github/workflows/flight-software-ci.yml'

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build and Static Analysis
    runs-on: ubuntu-24.04   # pinned

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential cppcheck libcmocka-dev

    - name: Configure CMake
      working-directory: software/flight
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_WERROR=ON

    - name: Build
      working-directory: software/flight
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Run cppcheck static analysis
      working-directory: software/flight
      run: |
        cppcheck --enable=all --inconclusive --std=c11 \
          --inline-suppr \
          --suppress=missingIncludeSystem \
          --suppress=missingInclude \
          --suppress=unusedFunction \
          --suppress=knownConditionTrueFalse \
          --suppress=unusedStructMember \
          --suppress=constParameterCallback \
          --suppress=constVariablePointer \
          --suppress=variableScope \
          --error-exitcode=1 \
          -I include \
          src/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: flight-software-build
        path: software/flight/build/smart_qso_flight

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04   # pinned
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libcmocka-dev lcov

    - name: Configure CMake with coverage
      working-directory: software/flight
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

    - name: Build
      working-directory: software/flight
      run: cmake --build build

    - name: Run tests
      working-directory: software/flight/build
      run: ctest --output-on-failure

    - name: Generate coverage report
      working-directory: software/flight
      run: |
        lcov --capture --directory build --output-file coverage.info
        lcov --ignore-errors unused --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: software/flight/coverage.info

  sanitizers:
    name: Sanitizer Checks
    runs-on: ubuntu-24.04   # pinned
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libcmocka-dev

    - name: Configure CMake with sanitizers
      working-directory: software/flight
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

    - name: Build
      working-directory: software/flight
      run: cmake --build build

    - name: Run the tests with sanitizers
      working-directory: software/flight
      env:
        # Leak checking off: the simulated HAL emulates flash with heap buffers
        # kept for the process lifetime, and flight code allocates nothing
        # (ctest no_dynamic_memory). AddressSanitizer and UBSan stay fatal.
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      run: ctest --test-dir build --output-on-failure

    - name: Run the simulation to completion with sanitizers
      working-directory: software/flight/build
      env:
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1   # see the step above
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        # About 20 s of simulated operation; any sanitizer report fails the job
        timeout 180 ./smart_qso_flight

  flight-build:
    name: Flight Configuration Build
    runs-on: ubuntu-24.04   # pinned

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Configure CMake for flight
      working-directory: software/flight
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFLIGHT_BUILD=ON -DENABLE_WERROR=ON

    - name: Build flight configuration
      working-directory: software/flight
      run: cmake --build build

    - name: Verify NDEBUG is defined
      working-directory: software/flight
      run: |
        # Check that debug code is disabled in flight build
        grep -q "NDEBUG" build/compile_commands.json || {
          echo "::error::NDEBUG is not defined in the flight build"
          exit 1
        }

  target-build:
    name: STM32L4 Cross-Compile (library)
    runs-on: ubuntu-24.04   # pinned

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install the Arm GNU toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
        arm-none-eabi-gcc --version

    - name: Configure (cmake/arm-none-eabi-stm32l4.cmake)
      working-directory: software/flight
      run: |
        # Absolute path: CMake resolves a relative toolchain file against the build directory
        cmake -B build-arm -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/arm-none-eabi-stm32l4.cmake" \
              -DCMAKE_BUILD_TYPE=Release -DENABLE_WERROR=ON

    - name: Build the flight library for Cortex-M4
      working-directory: software/flight
      run: cmake --build build-arm --parallel

    - name: Check the library
      working-directory: software/flight
      run: |
        arm-none-eabi-size --totals build-arm/libsmart_qso_target.a | tail -1
        # Thumb-2 code for the target, with the register-level HAL and the flight modules
        arm-none-eabi-objdump -f build-arm/libsmart_qso_target.a | grep -m1 'architecture: arm'
        for sym in hal_gpio_init hal_wdt_kick hal_reset_cause beacon_filter_check jetson_link_parse sm_process_event; do
          arm-none-eabi-nm --defined-only build-arm/libsmart_qso_target.a | grep -q " T ${sym}$" || {
            echo "::error::${sym} missing from the target library"
            exit 1
          }
        done

  documentation:
    name: Documentation Check
    runs-on: ubuntu-24.04   # pinned

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check required documentation exists
      run: |
        # Verify critical documentation files exist
        test -f software/flight/docs/FDIR_DESIGN.md
        test -f software/flight/docs/MEMORY_POLICY.md
        test -f software/flight/docs/LOOP_BOUNDS.md
        test -f software/flight/docs/MISRA_DEVIATIONS.md
        test -f software/flight/docs/JPL_POWER_OF_TEN_AUDIT.md
        test -f docs/safety/SOFTWARE_HAZARD_ANALYSIS.md
        test -f docs/safety/SOFTWARE_FMEA.md
        echo "All required documentation present"

    - name: Check for TODO/FIXME in production code
      working-directory: software/flight
      run: |
        # Warn about TODOs but don't fail
        grep -rn "TODO\|FIXME" src/ include/ || echo "No TODOs found"
