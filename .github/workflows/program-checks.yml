###############################################################################
# SMART-QSO Program Checks
#
# Runs on every pull request and on pushes to main, regardless of which paths
# changed, so documentation-only and regulatory changes are also gated.
#
# - Payload (Jetson) and ground software unit tests
# - Orbital lifetime estimator tests (supports the ODAR / 47 CFR 97.207(g))
# - Documentation reference integrity (no links to non-existent artifacts)
# - Requirements traceability: counts may not change without the baseline;
#   the generated RTM (docs/verification/RTM.csv) is current
# - Document control: each document ID on one file, every ID in docs/DOCUMENT_REGISTER.md
# - TBD/TBR register: docs/TBD_REGISTER.md current, each item ID unique, counts at baseline
# - Generated review records: the VCRM rows, the CDR RID log and the verification-item register
#   (docs/verification/VI_REGISTER.md: every item with a criterion and a dated event; every dated
#   action with an owner, a date and a criterion)
# - Secret scan (no keys or private-key material in tracked files)
###############################################################################

name: Program Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Payload, Ground and Simulation Tests
    runs-on: ubuntu-24.04   # pinned

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # The wire formats, from the Rust protocol crate (built with maturin;
          # the runner image has Rust, pinned by software/rust/rust-toolchain.toml)
          pip install ./software/rust/sqso-py
          pip install -e software/payload
          pip install -r software/simulation/orbit_lifetime/requirements.txt

      - name: Payload tests
        run: python -m pytest -q software/payload/tests

      - name: Ground tests
        run: python -m pytest -q software/ground/tests

      - name: Orbital lifetime tests
        working-directory: software/simulation/orbit_lifetime
        run: python -m pytest -q

      - name: Repository script tests
        run: python -m pytest -q scripts/tests

      # The hardware-test probe scripts (software/rust/firmware/BRINGUP.md):
      # their parsers and the HIL-004 sequence against a simulated board
      - name: Firmware probe tools
        run: |
          python -m pytest -q software/rust/firmware/tools/tests
          python software/rust/firmware/tools/guard_test.py --dry-run

  docs-integrity:
    name: Documentation Reference Integrity
    runs-on: ubuntu-24.04   # pinned

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation references
        run: python3 scripts/check_doc_references.py

      - name: Check generated command dictionary is current
        run: python3 scripts/gen_command_dictionary.py --check

      - name: Check parameters agree across code and documents
        run: python3 scripts/check_parameters.py

      - name: Traceability (no new undefined, conflicting or uncited requirements)
        run: python3 scripts/check_traceability.py --check

      - name: RTM is current
        run: python3 scripts/gen_rtm.py --check

      - name: TBD register is current
        run: python3 scripts/tbd_register.py --check

      - name: Document IDs are unique and registered
        run: python3 scripts/check_document_ids.py --check

      - name: Findings register summary matches its rows
        run: python3 scripts/register_status.py --check

      # Generated records of the CDR 2026 review (CM plan §4.5; RIDs PM-04, P3P-01)
      - name: VCRM requirement rows are current
        run: python3 software/simulation/cdr/pm/gen_vcrm.py --check

      - name: CDR review RID log is current
        run: python3 software/simulation/cdr/review/gen_rid_log.py --check

      - name: Verification-item register is current and complete
        run: python3 scripts/gen_vi_register.py --check

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04   # pinned

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan tracked files for keys
        run: python3 scripts/check_secrets.py
