###############################################################################
# SMART-QSO Flight Software CI/CD Pipeline
#
# Compliant with NASA NPR 7150.2 software engineering requirements
# Following NASA Ames Small Satellite Division heritage
###############################################################################

name: Flight Software CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    paths:
      - 'software/flight/**'
      - '.github/workflows/ci.yml'
  # Every PR, with no path filter: these jobs are required checks on main, and a
  # required check from a workflow that never starts would block the PR
  pull_request:
    branches: [main, develop]

env:
  BUILD_TYPE: Release
  # Line coverage of software/flight/src must not fall below this. Every compiled
  # source counts, including ones no test runs: measured 82.7 % in this job (the
  # Release build with coverage, gcovr 7.0) on 2026-10-16. Raise it as tests land;
  # never lower it to absorb a drop.
  COVERAGE_MIN_LINE: 80

jobs:
  ###########################################################################
  # Build and Unit Test Job
  ###########################################################################
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04   # pinned: tool versions and quality baselines depend on it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libcmocka-dev \
            cppcheck \
            clang-tidy \
            gcovr \
            valgrind

      - name: Configure CMake
        working-directory: software/flight
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DENABLE_COVERAGE=ON \
            -DENABLE_WERROR=ON

      - name: Build
        working-directory: software/flight
        run: cmake --build build --parallel $(nproc)

      - name: Run unit tests
        working-directory: software/flight
        run: ctest --test-dir build --output-on-failure --parallel $(nproc)

      # gcovr reads the .gcno files too, so a source no test runs counts as 0 %.
      # (lcov --capture skipped such files: four sources, about 930 lines, were
      # missing from the 84-85.5 % it reported.) Reproduce locally with
      # gcovr -r . --filter 'src/' build --print-summary
      - name: Coverage gate
        working-directory: software/flight
        run: |
          gcovr --version | head -1
          gcovr -r . --filter 'src/' build --print-summary \
            --txt coverage.txt --cobertura coverage.xml \
            --fail-under-line "$COVERAGE_MIN_LINE" || {
            cat coverage.txt
            echo "::error::Line coverage is below ${COVERAGE_MIN_LINE}% (or gcovr failed)"
            exit 1
          }
          cat coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: software/flight/coverage.xml
          flags: flight-software
          name: flight-coverage
          fail_ci_if_error: false

  ###########################################################################
  # Static Analysis Job
  ###########################################################################
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04   # pinned: tool versions and quality baselines depend on it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake cppcheck clang-tidy

      - name: Tool versions (pinned by the runner image)
        run: |
          cppcheck --version
          clang-tidy --version
          cppcheck --version | grep -q '^Cppcheck 2\.13\.' || {
            echo "::error::cppcheck is not 2.13.x; update the pin and the quality baselines together"
            exit 1
          }
          clang-tidy --version | grep -q 'version 18\.' || {
            echo "::error::clang-tidy is not 18.x; update the pin and the quality baselines together"
            exit 1
          }

      - name: Configure CMake (for compile_commands.json)
        working-directory: software/flight
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run cppcheck
        working-directory: software/flight
        run: |
          cppcheck \
            --enable=all \
            --inconclusive \
            --std=c11 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=knownConditionTrueFalse \
            --suppress=unusedStructMember \
            --suppress=constParameterCallback \
            --suppress=constVariablePointer \
            --suppress=variableScope \
            --error-exitcode=1 \
            -I include \
            src/

      - name: Function length (JPL rule 4; no new long functions)
        working-directory: software/flight
        run: |
          python3 scripts/function_length.py src/*.c src/hal/*.c
          ./scripts/ratchet.sh function-length "$(python3 scripts/function_length.py --count src/*.c src/hal/*.c)"

      - name: Run clang-tidy (no new findings)
        working-directory: software/flight
        run: |
          # The sources the host flight build compiles; test-only targets are left out,
          # so the count does not depend on cmocka being installed. hal_stm32l4.c is
          # compiled by the STM32L4 cross-compile.
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(python3 -c 'import json; print("\n".join(sorted({e["file"] for e in json.load(open("build/compile_commands.json")) if "/software/flight/src/" in e["file"] and not e["directory"].endswith("/tests")})))')
          echo "clang-tidy: ${#files[@]} source files"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no sources in build/compile_commands.json"; exit 1; }
          # A tool failure (including a compile error) fails the gate instead of counting as zero findings.
          # Configuration errors (.clang-tidy, .clang-format) go to stderr with exit 0, so check that too.
          status=0
          clang-tidy -p build "${files[@]}" > clang-tidy.txt 2> clang-tidy.log || status=$?
          if [ "$status" -ne 0 ] || grep -q ': error:' clang-tidy.log; then
            grep -E ': error:' clang-tidy.txt | sort -u | head -20 || true
            grep -E ': error:' clang-tidy.log | sort -u | head -20 || true
            tail -5 clang-tidy.log
            echo "::error::clang-tidy reported errors (exit ${status}); findings not counted"
            exit 1
          fi
          count=$(grep -E '^/.*:[0-9]+:[0-9]+: (warning|error):' clang-tidy.txt | sort -u | wc -l)
          ./scripts/ratchet.sh clang-tidy "$count"

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: |
            software/flight/clang-tidy.txt
            software/flight/clang-tidy.log

  ###########################################################################
  # MISRA C:2012 check (cppcheck MISRA addon; no new findings)
  #
  # An open-source checker, not a qualified MISRA tool. It shows the code is
  # not yet compliant and stops new violations; the report is archived.
  ###########################################################################
  misra-check:
    name: MISRA C:2012 Check
    runs-on: ubuntu-24.04   # pinned: tool versions and quality baselines depend on it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version | grep -q '^Cppcheck 2\.13\.' || {
            echo "::error::cppcheck is not 2.13.x; update the pin and the quality baselines together"
            exit 1
          }

      - name: Run the MISRA addon (no new findings)
        working-directory: software/flight
        run: |
          # The addon reports at style severity, so style must be enabled
          status=0
          cppcheck --addon=misra --enable=style --std=c11 --quiet -I include \
            --template='{file}:{line}:{column}: {id}' src/ 2> misra.txt || status=$?
          # A failed addon run exits 0 and reports internalError, so check for both
          if [ "$status" -ne 0 ] || grep -qE ': (internalError|internalAstError|syntaxError|cppcheckError)$' misra.txt; then
            grep -E ': (internalError|internalAstError|syntaxError|cppcheckError)$' misra.txt | head -20 || true
            echo "::error::cppcheck MISRA run failed (exit ${status}); findings not counted"
            exit 1
          fi
          count=$(grep -cE ': misra-c2012-' misra.txt || true)
          echo "MISRA findings by rule:"
          grep -oE 'misra-c2012-[0-9.]+' misra.txt | sort | uniq -c | sort -rn | head -25
          ./scripts/ratchet.sh misra "$count"

      - name: Upload MISRA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misra-report
          path: software/flight/misra.txt

  ###########################################################################
  # Security Scan Job
  ###########################################################################
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04   # pinned: tool versions and quality baselines depend on it
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build for analysis
        working-directory: software/flight
        run: |
          cmake -B build
          cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  ###########################################################################
  # Documentation Generation Job
  ###########################################################################
  documentation:
    name: Generate Documentation
    runs-on: ubuntu-24.04   # pinned: tool versions and quality baselines depend on it
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        working-directory: software/flight
        run: |
          if [ -f Doxyfile ]; then
            doxygen Doxyfile
          else
            echo "Doxyfile not found - skipping documentation generation"
          fi

  ###########################################################################
  # Flight Build Validation Job
  ###########################################################################
  flight-build:
    name: Flight Build Validation
    runs-on: ubuntu-24.04   # pinned: tool versions and quality baselines depend on it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure Flight Build
        working-directory: software/flight
        run: |
          cmake -B build \
            -DFLIGHT_BUILD=ON \
            -DENABLE_WERROR=ON

      - name: Build Flight Configuration
        working-directory: software/flight
        run: cmake --build build --parallel $(nproc)

      - name: Verify no debug symbols
        working-directory: software/flight
        run: |
          if nm build/smart_qso_flight | grep -q "printf"; then
            echo "Note: printf symbols present (expected in simulation stub)"
          fi
