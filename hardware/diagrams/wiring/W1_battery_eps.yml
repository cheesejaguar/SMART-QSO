# SQSO-HW-DIAG-001 W1: battery pack to EPS (SQSO-HAR-001 H1, extended for 4S). Updated 2026-10-27 to the EPS board
# design SQSO-EPS-BRD-001 (hardware/electrical/eps/EPS_BOARD_DESIGN.md): power on a 2x4 Micro-Fit (two contacts per
# pole), NTC1 with its own return (the EPS's hardware charge-window and over-temperature comparators, ground domain),
# the heater pair (207 Ohm film, 40 degC cutout on the EPS), and a 6-way tap connector carrying the five cell taps and
# NTC2 (the AFE's thermistor, returned to the cell-1 negative tap at the pack). Flying leads >= 100 mm, no stack connector.
metadata:
  title: W1 Battery pack to EPS (SQSO-HW-DIAG-001, SQSO-EPS-BRD-001)

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: SHORT

connectors:
  P1:
    type: Molex Micro-Fit 3.0 receptacle 43025-0800
    subtype: 8 pos, 2 rows
    notes: battery side
    pinlabels: [BAT_TOP, BAT_TOP, BAT_BOT, BAT_BOT, NTC1, NTC1_RTN, HTR+, HTR-]
  J1:
    type: Molex Micro-Fit 3.0 header 0430450812
    subtype: 8 pos, 2 rows
    notes: EPS board J1
    pinlabels: [BAT_TOP, BAT_TOP, BAT_BOT, BAT_BOT, NTC1, NTC1_RTN (GND), HTR_P, HTR_N]
  P2:
    type: Molex Pico-Clasp receptacle 501330-0600
    subtype: 6 pos
    notes: battery side, cell taps and NTC2
    pinlabels: [TAP0 (cell 1-), TAP1, TAP2, TAP3, TAP4 (cell 4+), NTC2]
  J2:
    type: Molex Pico-Clasp header 5013310607
    subtype: 6 pos
    notes: EPS board J2 -> AFE U1 (100 Ohm + 0.1 uF) and secondary protector U2 (1 kOhm + 0.1 uF)
    pinlabels: [TAP0, TAP1, TAP2, TAP3, TAP4, NTC2]

cables:
  C1:
    category: bundle
    gauge: 20 AWG
    length: 0.10
    colors: [RD, RD, BK, BK]
    notes: PTFE; 2 wires per pole, 3 A each derated (SQSO-HAR-001 5.2); 1.3 A worst load, 5 A fuse F2
  C2:
    category: bundle
    gauge: 26 AWG
    length: 0.10
    colors: [WH, GY, VT, BU]
    notes: NTC1 pair (own return, isolated from the cells) twisted; heater pair twisted, 79 mA at 16.4 V
  C3:
    category: bundle
    gauge: 28 AWG
    length: 0.10
    colors: [BK, BN, RD, OG, YE, WH]
    notes: sense only; NTC2 returns to TAP0 inside the pack

connections:
  - - P1: [1-4]
    - C1: [1-4]
    - J1: [1-4]
  - - P1: [5-8]
    - C2: [1-4]
    - J1: [5-8]
  - - P2: [1-6]
    - C3: [1-6]
    - J2: [1-6]
