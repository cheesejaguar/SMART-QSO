# SQSO-HW-DIAG-001 W6: ADCS harnesses, version 3 (2026-10-27; SQSO-ICX-001 §3.4, SQSO-OBC-BRD-001 §9-§10). There is no
# separate ADCS board: the gyro (Epson M-G370PDT0 in socket X1), the BMI088 backup, the
# sun-sensor amplifiers and the three DRV8876 magnetorquer H-bridges are on the OBC board (RID AV-03). W6 now carries:
# W6B the 3V3_ADCS rail from EPS SW4 (ADCS_EN PB6, 0.30 A trip) into the OBC's three latch-up-protected sensor switches;
# W6C the three CubeSpace CR0002 rods; W6D the six panel photodiodes. The magnetorquer supply VBAT_MTQ comes over W3.
# Version 1's FTSH board-to-board connector and the DRV8833 inputs are deleted. Version 3: the RM3100 magnetometer moves
# to board A2 at the +Z end frame on W6E (OBC J10 to A2 J1), away from the rods (OBC board 9.4).
metadata:
  title: W6 ADCS v3 (SQSO-HW-DIAG-001; SQSO-ICX-001 3.4)

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: SHORT

connectors:
  J_EPS_ADCS:
    type: Molex Pico-Clasp 5013310207
    subtype: 2 pos
    notes: "EPS J20: SW4 3V3_ADCS (ADCS_EN PB6), 0.265-0.339 A trip"
    pinlabels: &w6pwr [3V3_ADCS, GND]
  J_OBC_ADCS:
    type: Molex Pico-Clasp 5013310207
    subtype: 2 pos
    notes: "OBC J6: into U5 (gyro), U6 (BMI088), U7 (magnetometer, sun sensors)"
    pinlabels: *w6pwr
  J_OBC_MTQ:
    type: Molex Pico-Clasp 5013310607
    subtype: 6 pos
    notes: "OBC J7: DRV8876 U22 (X), U23 (Y), U24 (Z) OUT1/OUT2"
    pinlabels: [X+, X-, Y+, Y-, Z+, Z-]
  ROD_X:
    type: CubeSpace CR0002 rod (X)
    subtype: Molex Pico-Lock lead (rod side, per the CubeSpace ICD)
    pinlabels: [+, '-']
  ROD_Y:
    type: CubeSpace CR0002 rod (Y)
    subtype: Molex Pico-Lock lead
    pinlabels: [+, '-']
  ROD_Z:
    type: CubeSpace CR0002 rod (Z)
    subtype: Molex Pico-Lock lead
    pinlabels: [+, '-']
  J_OBC_SS:
    type: Molex Pico-Clasp 5013311407
    subtype: 14 pos
    notes: "OBC J8: cathodes to the TLV9002 transimpedance inputs, anodes to ground; pins 13, 14 shield drains"
    pinlabels: [PX_K, PX_A, MX_K, MX_A, PY_K, PY_A, MY_K, MY_A, PZ_K, PZ_A, MZ_K, MZ_A, SHIELD_1, SHIELD_2]
  PANELS:
    type: panel photodiodes (bought with the panels, BUILD_VS_BUY 2.3)
    subtype: x6, short-circuit current at most 4.0 mA at AM0 normal incidence (requirement on the panel vendor)
    pinlabels: [PX_K, PX_A, MX_K, MX_A, PY_K, PY_A, MY_K, MY_A, PZ_K, PZ_A, MZ_K, MZ_A, SHIELD_1, SHIELD_2]
  J_OBC_MAG:
    type: Molex Pico-Clasp 5013310607
    subtype: 6 pos
    notes: "OBC J10: 3V3_SNS from U7, I2C4 SNS side via U14, DRDY via U33 to PD11"
    pinlabels: &w6mag [3V3_SNS, GND, SDA_S, SCL_S, MG_DRDY, GND]
  J_MAG:
    type: Molex Pico-Clasp 5013310607
    subtype: 6 pos
    notes: "magnetometer board A2 J1 (RM3100 at 0x20), +Z end frame"
    pinlabels: *w6mag

cables:
  W6B:
    category: bundle
    gauge: 26 AWG
    length: 0.08
    wirecount: 2
    colors: [RD, BK]
    notes: "0.049 A worst normal (backup gyro on); 0.339 A at the SW4 trip: 68 % of the 26 AWG derated 0.5 A"
  W6C:
    category: bundle
    gauge: 26 AWG
    length: 0.10
    wirecount: 6
    colors: [RD, BK, RD, BK, RD, BK]
    notes: "three twisted pairs; 0.087 A at 0.2 A.m2, 0.126 A at the bridges' hardware limit (25 % of 0.5 A). Route away from the RM3100 corner of the OBC (SQSO-OBC-BRD-001 14)"
  W6D:
    category: bundle
    gauge: 28 AWG
    length: 0.12
    wirecount: 14
    colors: [WH, BK, WH, BK, WH, BK, WH, BK, WH, BK, WH, BK, GY, GY]
    shield: true
    notes: "six twisted pairs in one shield, drains to OBC ground at J8 only; photocurrent at most 4 mA"
  W6E:
    category: bundle
    gauge: 28 AWG
    length: 0.25
    wirecount: 6
    colors: [RD, BK, BU, YE, WH, BK]
    notes: "OBC to the +Z end frame through a wall gap; SDA and SCL each twisted with a ground; I2C at 100 kHz; under 2 mA"

connections:
  - - J_OBC_MAG: [1-6]
    - W6E: [1-6]
    - J_MAG: [1-6]
  - - J_EPS_ADCS: [1-2]
    - W6B: [1-2]
    - J_OBC_ADCS: [1-2]
  - - J_OBC_MTQ: [1-2]
    - W6C: [1-2]
    - ROD_X: [1-2]
  - - J_OBC_MTQ: [3-4]
    - W6C: [3-4]
    - ROD_Y: [1-2]
  - - J_OBC_MTQ: [5-6]
    - W6C: [5-6]
    - ROD_Z: [1-2]
  - - J_OBC_SS: [1-14]
    - W6D: [1-14]
    - PANELS: [1-14]
