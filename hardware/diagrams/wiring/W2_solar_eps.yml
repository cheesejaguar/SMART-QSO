# SQSO-HW-DIAG-001 W2: solar panels to EPS (SQSO-HAR-001 H8, extended to the 8-string array).
# Array per hardware/eps/SOLAR_ARRAY_DESIGN.md and B2: body +X, -X, +Y, -Y one string each; wings W1, W2 two
# strings each (front and back). Every string has its own blocking diode on the EPS, so each keeps its own
# positive wire. H8's 3-pin connector serves a body panel; the wing needs 5 pins (proposed). Pinouts TBR.
metadata:
  title: W2 Solar panels to EPS (SQSO-HW-DIAG-001, proposed, TBR)

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: SHORT

connectors:
  PB:
    type: Molex Pico-Clasp receptacle
    subtype: 3 pos
    notes: body panel (x4, +X -X +Y -Y), H8
    pinlabels: [SA+, SA-, TEMP]
  JB:
    type: Molex Pico-Clasp header
    subtype: 3 pos
    notes: EPS J_SA_PX / NX / PY / NY; SA+ to blocking diode Dn
    pinlabels: [SA+, SA-, TEMP]
  PW:
    type: Molex Pico-Clasp receptacle
    subtype: 5 pos
    notes: wing (x2, W1 W2); harness crosses the hinge as a service loop
    pinlabels: [SA1+ (front), SA2+ (back), SA-, SA-, TEMP]
  JW:
    type: Molex Pico-Clasp header
    subtype: 5 pos
    notes: EPS J_SA_W1 / W2
    pinlabels: [SA1+, SA2+, SA-, SA-, TEMP]

cables:
  CB:
    category: bundle
    gauge: 24 AWG
    length: 0.10
    colors: [RD, BK, WH]
    notes: 2 cells in series, Isc about 0.5 A; TEMP 10 kOhm NTC, return on SA- (TBR)
  CW:
    category: bundle
    gauge: 24 AWG
    length: 0.18
    colors: [RD, OG, BK, BK, WH]
    notes: length TBD with the hinge; flex-rated PTFE, tie down at both sides

connections:
  - - PB: [1-3]
    - CB: [1-3]
    - JB: [1-3]
  - - PW: [1-5]
    - CW: [1-5]
    - JW: [1-5]
