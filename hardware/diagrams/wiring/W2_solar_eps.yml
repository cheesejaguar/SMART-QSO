# SQSO-HW-DIAG-001 W2: solar panels to EPS (SQSO-HAR-001 H8, extended to the 8-string array). Updated 2026-10-27 to the
# EPS board design SQSO-EPS-BRD-001: body +X, -X, +Y, -Y one string each (J4 PX, J5 MX, J6 PY, J7 MY); wings W1, W2
# two strings each, front and back (J8, J9). Each string keeps its own positive wire: it has its own SMBJ7.0A TVS and
# LM74700 ideal diode on the EPS, then joins its tracker (T1 W1F+W2F, T2 PY, T3 W1B+W2B, T4 PX+MX+MY). TEMP is the
# panel NTC (10 kOhm, returned on SA-), read by the EPS controller's ADC (U36).
metadata:
  title: W2 Solar panels to EPS (SQSO-HW-DIAG-001, SQSO-EPS-BRD-001)

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: SHORT

connectors:
  PB:
    type: Molex Pico-Clasp receptacle 501330-0500
    subtype: 5 pos
    notes: body panel (x4, +X -X +Y -Y), H8 extended to two contacts per pole
    pinlabels: [SA+, SA+, SA-, SA-, TEMP]
  JB:
    type: Molex Pico-Clasp header 5013310507
    subtype: 5 pos
    notes: EPS J4 PX / J5 MX / J6 PY / J7 MY
    pinlabels: [S_face, S_face, GND, GND, TPNL_face]
  PW:
    type: Molex Pico-Clasp receptacle 501330-0800
    subtype: 8 pos
    notes: wing (x2, W1 W2); harness crosses the hinge as a service loop
    pinlabels: [SA1+ (front), SA1+ (front), SA2+ (back), SA2+ (back), SA-, SA-, SA-, TEMP]
  JW:
    type: Molex Pico-Clasp header 5013310807
    subtype: 8 pos
    notes: EPS J8 W1 / J9 W2
    pinlabels: [S_wF, S_wF, S_wB, S_wB, GND, GND, GND, TPNL_w]

cables:
  CB:
    category: bundle
    gauge: 26 AWG
    length: 0.10
    colors: [RD, RD, BK, BK, WH]
    notes: "2 cells in series, Isc ≤ 0.55 A; Pico-Clasp crimps take 26-32 AWG, so each pole is two 26 AWG wires on two contacts (0.28 A each, 0.5 A derated; EPS-13)"
  CW:
    category: bundle
    gauge: 26 AWG
    length: 0.18
    colors: [RD, RD, OG, OG, BK, BK, BK, WH]
    notes: length set with the hinge; flex-rated PTFE, tie down at both sides

connections:
  - - PB: [1-5]
    - CB: [1-5]
    - JB: [1-5]
  - - PW: [1-8]
    - CW: [1-8]
    - JW: [1-8]
