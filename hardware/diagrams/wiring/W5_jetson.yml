# SQSO-HW-DIAG-001 W5: EPS and OBC to the Jetson carrier, version 2 (2026-10-27; SQSO-ICX-001 §3.3, SQSO-OBC-BRD-001 §9).
# Power (W5A): VBAT behind SW1 (PAYLOAD_EN PB2) and the eFuse U19 (JETSON_PWR PA2) on EPS J18, 11.2-16.4 V, 0.93 A at the
# 12 W guard, 1.2 A eFuse trip; the carrier has its own converter (EPS_DESIGN 2.0 §4, RID EMC-02). Version 1 carried
# +5 V. Link (W5B): USART1 PA9/PA10 through SN74LVC1T45 translators U28/U29 whose carrier-side supply is the carrier's own
# 3.3 V I/O rail on pin 4, so an unpowered carrier sees high impedance (RID AV-09, finding F13); the same pin is the
# carrier power-good readback JET_PG on PG6 (RID AV-06). JST-SH (finding F14) replaced by Molex Pico-Clasp. The
# carrier-side header is the carrier designer's: on the Orin Nano 40-pin header UART1 is pin 8 TXD / pin 10 RXD and
# 3.3 V is pin 1 (PAYLOAD_DESIGN Appendix A); the carrier must supply pin 4 from the module's 3.3 V I/O rail, <= 1 mA.
metadata:
  title: W5 EPS and OBC to Jetson carrier v2 (SQSO-HW-DIAG-001; SQSO-ICX-001 3.3)

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: SHORT

connectors:
  J_EPS_JET:
    type: Molex Micro-Fit 3.0 header 0430450412
    subtype: 4 pos
    notes: "EPS J18: VBAT_JET behind SW1 and the eFuse U19"
    pinlabels: &w5pwr [VBAT_JET, VBAT_JET, GND, GND]
  J_JET_PWR:
    type: Molex Micro-Fit 3.0 receptacle
    subtype: 4 pos
    notes: carrier DC input (11.2-16.4 V)
    pinlabels: *w5pwr
  J_OBC_JET:
    type: Molex Pico-Clasp 5013310407
    subtype: 4 pos, 1.0 mm
    notes: "OBC J3: PA9 TX via U28, PA10 RX via U29, JET_3V3 to PG6 (10 k)"
    pinlabels: &w5sig [GND, JET_RXD (OBC TX), JET_TXD (OBC RX), JET_3V3 (carrier I/O rail)]
  J_JET_UART:
    type: Molex Pico-Clasp 5013310407 on the carrier
    subtype: 4 pos, 1.0 mm
    notes: "carrier: UART1 RXD (header pin 10), TXD (pin 8), 3.3 V I/O rail (pin 1 via the carrier)"
    pinlabels: *w5sig

cables:
  W5A:
    category: bundle
    gauge: 22 AWG
    length: 0.10
    wirecount: 4
    colors: [RD, RD, BK, BK]
    notes: "2 x 22 AWG per pole: 0.93 A over two wires at the 12 W guard, 22 AWG derated 2 A (SQSO-HAR-001 5.2): 23 %"
  W5B:
    category: bundle
    gauge: 28 AWG
    length: 0.10
    wirecount: 4
    colors: [BK, GN, YE, OG]
    notes: "115200 baud 8N1, SMART-QSO-ICD-002 framing; twisted with its ground. Signal currents under 5 mA"

connections:
  - - J_EPS_JET: [1-4]
    - W5A: [1-4]
    - J_JET_PWR: [1-4]
  - - J_OBC_JET: [1-4]
    - W5B: [1-4]
    - J_JET_UART: [1-4]
