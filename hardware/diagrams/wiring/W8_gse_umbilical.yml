# SQSO-HW-DIAG-001 W8: GSE umbilical, version 4 (2026-10-27; SQSO-ICX-001 3.6, SQSO-OBC-BRD-001 15, SQSO-EPS-BRD-001
# 6.5, harness design SQSO-HAR-001 2.0). One flight connector at the -Y access window (-Z end zone): a Micro-D 21 socket
# receptacle on the access-port board A3, which joins the OBC's debug and key-loading lines (W8A, from OBC J9) and the
# EPS's charging path (W11, from EPS J13). The 2x5 2.54 mm bulkhead of version 3 does not fit the window (a shrouded
# 2x5 2.54 mm header is about 20 x 9 mm). W8A is a Samtec SFSDT single-ended PTFE assembly (30 AWG) on a TFM-105
# right-angle header (was FTSH-105), free end soldered to A3; W11 is 24 AWG from a Micro-Fit 2x3 (EPS J13, zone Z5),
# soldered to A3. On the Micro-D the charging pins (9-11, 19-21) are separated from the debug pins by unused pins 8 and
# 18. W8B, the GSE cable, is not flown: its plug ties UMBILICAL_SENSE (13) to VTREF (1). The GSE UART adapter must be
# powered from VTREF (10 k on the OBC limits back-power to 0.3 mA).
# Version 5 (2026-10-27, SQSO-ICX-001 D, board FMEA SMA-B14): pin 6 is RST_REQ, an active-high reset request (the OBC's Q1
# pulls NRST); the GSE adapter drives it high from VTREF through an inverter from the probe's nRESET.
metadata:
  title: W8 GSE umbilical and W11 charging v4 (SQSO-HW-DIAG-001; SQSO-ICX-001 3.6; SQSO-HAR-001 2.0)

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: SHORT

connectors:
  J_OBC_ACC:
    type: Samtec TFM-105 right-angle (was FTSH-105), SFSDT socket
    subtype: 2x5, 1.27 mm, latched
    notes: "OBC J9, -X edge, y -24 ... -34: PA13, PA14, RST_REQ (Q1 to NRST), PD8, PD9, PB8, TPS3850 SET0"
    pinlabels: [VTREF (3V3_OBC via 100 Ohm), SWDIO, GND, SWCLK, WDT_DIS, RST_REQ, USART3_TX (OBC out), USART3_RX (OBC in), UMBILICAL_SENSE, GND]
  J_EPS_UMB:
    type: Micro-Fit 3.0 receptacle 43025-0600, gold 43030 terminals
    subtype: 2x3
    notes: "EPS J13 (zone Z5): UMB_CHG via F5 1 A and D16 to PACK_P; PACK_N; UMB_VMON (100 k from BAT_F); UMB_SHUT"
    pinlabels: [UMB_CHG, UMB_CHG, PACK_N, PACK_N, UMB_VMON, UMB_SHUT]
  A3:
    type: access-port board A3, Micro-D 21 socket receptacle (MIL-DTL-83513 class), gold
    subtype: 21 pos; 8, 15-18 not used
    notes: "board 30 x 8.8 x 1.6 mm (SQSO-OBC-BRD-001 C 15.1) in the envelope 30 x 7 x 8.8 mm at the -Y window (-20, -50, -43); W8A (pin-1 end) and W11 (other end) soldered in plated holes; ESD/TVS on A3; pin map SQSO-ICX-001 C 3.6"
    pinlabels: [VTREF, SWDIO, GND, SWCLK, WDT_DIS, RST_REQ, USART3_TX, NC, UMB_VMON, PACK_N, PACK_N, USART3_RX, UMBILICAL_SENSE, GND, NC, NC, NC, NC, UMB_SHUT, UMB_CHG, UMB_CHG]
  P_GSE:
    type: Micro-D 21 pin plug (GSE)
    subtype: 21 pos
    notes: "GSE cable: SWD probe (VTREF sense only), 3.3 V USB-UART referenced to VTREF, pin 13 jumpered to pin 1, WDT_DIS switch to VTREF; charger on 20/21 and 10/11, voltmeter on 9, AFE shutdown on 19"
    pinlabels: [VTREF, SWDIO, GND, SWCLK, WDT_DIS, RST_REQ, USART3_TX, NC, UMB_VMON, PACK_N, PACK_N, USART3_RX, UMBILICAL_SENSE, GND, NC, NC, NC, NC, UMB_SHUT, UMB_CHG, UMB_CHG]

cables:
  W8A:
    type: Samtec SFSDT single-ended, PTFE, 30 AWG
    category: bundle
    gauge: 30 AWG
    length: 0.145
    wirecount: 10
    colors: [WH, WH, BK, WH, WH, WH, WH, WH, WH, BK]
    notes: "internal, flown; down the (-X, -Y) bundle, the (-X, -Y) corner strip and flat along the -Y shear panel outboard of the (-40, -43) column"
  W11:
    gauge: 24 AWG
    length: 0.175
    wirecount: 6
    colors: [RD, RD, BK, BK, WH, YE]
    notes: "M22759/33-24; charge pairs twisted (1+3, 2+4); 0.5 A ground charge on two wires per pole (14 mV); under the EPS, through the -Y deck slot and down the -Y wall strip"
  W8B:
    type: GSE cable (not flown)
    category: bundle
    gauge: 26 AWG
    length: 1.0
    wirecount: 21
    notes: "Ground support only; removed before flight with the RBF pin"

connections:
  - - J_OBC_ACC: [1-7]
    - W8A: [1-7]
    - A3: [1-7]
  - - J_OBC_ACC: [8-10]
    - W8A: [8-10]
    - A3: [12-14]
  - - J_EPS_UMB: [1-6]
    - W11: [1-6]
    - A3: [20, 21, 10, 11, 9, 19]
  - - A3: [1-21]
    - W8B: [1-21]
    - P_GSE: [1-21]
