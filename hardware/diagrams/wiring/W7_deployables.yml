# SQSO-HW-DIAG-001 W7: deployables and inhibits, version 3 (2026-10-27, harness design SQSO-HAR-001 2.0; EPS side per
# SQSO-EPS-BRD-001 9, 6.2, 13.1). Two burn resistors per wing on their own 0.8 A drivers (12 s hardware one-shot) from
# EPS J10 (wing W1) and J11 (wing W2), both right-angle Micro-Fit on the EPS bottom side. Wing 2: the burn pairs drop
# through a deck opening and the inboard strip beside the battery end cap to the burn board at the -Y free corner; wing
# 1: along the +X wall gap below the EPS and down the (+X, -Y) bundle; the sense pairs go down the hinge-side strips to
# the wings' deployed-state sensors (both wings in series). The AntS
# (W7C) takes 3.3 V from SW8 and I2C2 from EPS J12, which becomes a Pico-Clasp 6 with two contacts per supply pole (one
# contact would carry 0.61 A, above 50 % of its 1 A rating), down the -X centre strip, under the battery end cap and
# through the -Z end-frame cut-out, spliced to the AntS pigtail. W12A-C: one harness per deployment switch, each on its
# own rail and route (DS1 +X+Y at -Z, DS2 -X-Y at -Z, DS3 +X-Y at +Z); DS2 is two-pole (DPDT): its second pole holds
# the tracker clamp Q40 on when stowed (third array inhibit, active high, EPS_BOARD_DESIGN E 6.2), so W12B has five
# wires; W12C two (DS3's NO dropped); W12D the two-pole RBF (pole B active high to Q41). AntS side B on W7C pins 7-8.
metadata:
  title: W7 Deployables and inhibits v3 (SQSO-HW-DIAG-001; SQSO-EPS-BRD-001; SQSO-HAR-001 2.0)

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: SHORT

connectors:
  J10:
    type: Micro-Fit 3.0 receptacle 43025-0600, gold 43030-0003 terminals
    subtype: 6 pos, 2 rows
    notes: "EPS J10 (zone Z3), wing W1: drivers Q24 (W1A, BURN_W1A PB10) and Q25 (W1B, BURN_W1B PE6)"
    pinlabels: [V_BURN, BRET_W1A, V_BURN, BRET_W1B, SA_SENSE_PU, SA_SENSE_MID]
  BB_W1:
    type: wing W1 burn board (two burn resistors), solder pads
    notes: "(+47.5, -37.5, -40); about 5 Ohm each"
    pinlabels: [R_W1A a, R_W1A b, R_W1B a, R_W1B b]
  HS_W1:
    type: wing W1 deployed-state sensor lead, TE D-200-82 nickel-barrel splice
    notes: hinge-side strip at z -39
    pinlabels: [in, out]
  J11:
    type: Micro-Fit 3.0 receptacle 43025-0600, gold 43030-0003 terminals
    subtype: 6 pos, 2 rows
    notes: "EPS J11 (zone Z2), wing W2: drivers Q26 (W2A, BURN_W2A PB9) and Q27 (W2B, BURN_W2B PE7)"
    pinlabels: [V_BURN, BRET_W2A, V_BURN, BRET_W2B, SA_SENSE_MID, GND]
  BB_W2:
    type: wing W2 burn board (two burn resistors), solder pads
    notes: "(-47.5, -37.5, -40)"
    pinlabels: [R_W2A a, R_W2A b, R_W2B a, R_W2B b]
  HS_W2:
    type: wing W2 deployed-state sensor lead, TE D-200-82 nickel-barrel splice
    pinlabels: [in, out]
  J12:
    type: Pico-Clasp 8 pos, gold terminals (EPS J12, was 4)
    subtype: 8 pos
    notes: "EPS J12 (zone Z5): AntS supply, I2C side A (U80 B side) and side B 0x32 through 0 ohm jumpers (SQSO-ICX-001 E15)"
    pinlabels: [3V3_ANTS, 3V3_ANTS, GND, GND, ANTS_SDA, ANTS_SCL, ANTS_SDA_B, ANTS_SCL_B]
  ANTS:
    type: ISIS AntS pigtail, soldered on termination tab TB-ANT
    subtype: own controller, redundant thermal knives
    notes: "through the -Z end-frame cut-out at (-31, -16); pinout from the AntS ICD"
    pinlabels: [VCC 3V3, VCC 3V3, GND, GND, SDA A, SCL A, SDA B, SCL B]
  J15:
    type: Pico-Clasp 501330-0300, gold terminals
    subtype: 3 pos (pin 3 not used)
    notes: EPS J15 (zone Z3)
    pinlabels: [DS1_C, S1N]
  DS1:
    type: deployment switch DS1 (rail +X+Y, -Z), solder terminals
    pinlabels: [C, NC]
  J16:
    type: Pico-Clasp 5 pos, gold terminals
    subtype: 5 pos (pin 3 not connected on the EPS)
    notes: "EPS J16 (zone Z2): pole 1 pack-return FET drive (PACK domain); pole 2 array inhibit, active high: C2 VCTL via 10 k, NO2 to the gate of tracker clamp Q40 (EPS_BOARD_DESIGN E 6.2, SMA-B13). Fallback: pins 4-5 to a second SPDT DS2B in the +Z standoff of the same rail"
    pinlabels: [DS2_C, S2N, NO1 (NC on EPS), DS2_C2 (VCTL), TCL_A_W (clamp gate)]
  DS2:
    type: deployment switch DS2, two-pole (DPDT) (rail -X-Y, -Z), solder terminals
    pinlabels: [C1, NC1, NO1, C2, NO2]
  J17:
    type: Pico-Clasp 501330-0300, gold terminals
    subtype: 3 pos (pin 3 not used, Version E)
    notes: EPS J17 (zone Z4)
    pinlabels: [GND, S3N]
  DS3:
    type: deployment switch DS3 (rail +X-Y, +Z), solder terminals
    pinlabels: [C, NC]
  J14:
    type: Pico-Clasp 501330-0400, gold terminals
    subtype: 4 pos
    notes: EPS J14 (zone Z4, -Y edge)
    pinlabels: [S2N, S2R, TCL_B_W (clamp gate), RBF_C2 (VCTL)]
  RBF:
    type: RBF switch, two poles, solder terminals
    notes: "(+20, -45, -43), -Y access window"
    pinlabels: [A1, A2, B1, B2]

cables:
  W7A_B:
    gauge: 24 AWG
    length: 0.15
    colors: [VT, BK, VT, BK]
    notes: "M22759/33-24 (Micro-Fit minimum); pairs twisted; 0.88 A for 12 s, one resistor at a time; under the EPS, along the +X wall gap below the EPS (within 20 mm of y = 0) and down the (+X, -Y) bundle to the burn board; loop 50 mohm, 44 mV"
  W7A_S:
    gauge: 24 AWG
    length: 0.095
    colors: [OG, BN]
    notes: "sense pair, twisted, down the +X hinge-side strip"
  W7B_B:
    gauge: 24 AWG
    length: 0.09
    colors: [VT, BK, VT, BK]
  W7B_S:
    gauge: 24 AWG
    length: 0.155
    colors: [OG, BN]
  W7C:
    gauge: 28 AWG
    length: 0.155
    colors: [RD, RD, BK, BK, BU, YE, VT, GY]
    notes: "M22759/33-28; pairs 1+3, 2+4, 5+6 (side A), 7+8 (side B); 0.61 A peak on two wires per pole (34 %), 37 mV"
  W12A:
    gauge: 28 AWG
    length: 0.09
    colors: [WH, BU]
    notes: "twisted pair; microamperes; 10 k at the EPS end limits a short to the frame to 1.7 mA"
  W12B:
    gauge: 28 AWG
    length: 0.10
    colors: [WH, BU, GY, OG, GN]
    notes: "pole 1 triple (1, 2, 3; 3 spare) and pole 2 pair (4, 5) twisted; microamperes; pole 2 active high (a chafe to the frame cannot disable the trackers)"
  W12C:
    gauge: 28 AWG
    length: 0.11
    colors: [BK, BU]
    notes: "DS3's NO wire dropped (EPS Version E); +X wall gap at y -39.5 ... -45.5 (beside W4A), from the +Z rail end down to the EPS"
  W12D:
    gauge: 28 AWG
    length: 0.085
    colors: [BU, WH, GN, OG]
    notes: "-Y wall strip and the -Y deck slot; pole A in DS2's drive; pole B carries VCTL to the gate of tracker clamp Q41 with the pin in (active high)"

connections:
  - - J10: [1-4]
    - W7A_B: [1-4]
    - BB_W1: [1-4]
  - - J10: [5-6]
    - W7A_S: [1-2]
    - HS_W1: [1-2]
  - - J11: [1-4]
    - W7B_B: [1-4]
    - BB_W2: [1-4]
  - - J11: [5-6]
    - W7B_S: [1-2]
    - HS_W2: [1-2]
  - - J12: [1-8]
    - W7C: [1-8]
    - ANTS: [1-8]
  - - J15: [1-2]
    - W12A: [1-2]
    - DS1: [1-2]
  - - J16: [1-5]
    - W12B: [1-5]
    - DS2: [1-5]
  - - J17: [1-2]
    - W12C: [1-2]
    - DS3: [1-2]
  - - J14: [1-4]
    - W12D: [1-4]
    - RBF: [1-4]
