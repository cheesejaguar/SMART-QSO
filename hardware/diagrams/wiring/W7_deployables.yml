# SQSO-HW-DIAG-001 W7: EPS deployment drivers to the solar-wing hold-downs and to the ISIS AntS. Updated 2026-10-27 to
# the EPS board design SQSO-EPS-BRD-001 (RIDs EPS-07, EPS-18, REL-03, SMA-05): two burn resistors per wing, each on its
# own 0.8 A current-limited driver with a 12 s hardware one-shot (four drivers, Q24-Q27), supplied from the 7.0 V burn
# buck behind SW6 (DEPLOY_EN) and the three deployment-switch inhibits; the wings' hinge switches in series (both
# deployed = SOLAR_SENSE low). The AntS deploys itself (I2C arm and automatic deployment): it takes 3.3 V from SW8
# (DEPLOY_EN) downstream of DS1-DS3 and I2C2 through the TCA9517 buffer U80. AntS pinout to be confirmed from the AntS
# ICD delivered with the unit (ISIS-ANTS-DSH-0001 could not be retrieved).
metadata:
  title: W7 Deployables, burn and sense (SQSO-HW-DIAG-001, SQSO-EPS-BRD-001)

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: SHORT

connectors:
  J10:
    type: Molex Micro-Fit 3.0 header 0430450612
    subtype: 6 pos, 2 rows
    notes: "EPS J10, wing W1: drivers Q24 (W1A, BURN_W1A PB10) and Q25 (W1B, BURN_W1B PE6)"
    pinlabels: [V_BURN, BRET_W1A, V_BURN, BRET_W1B, SA_SENSE_PU, SA_SENSE_MID]
  WING1:
    type: wing W1 hold-down (bought with the panels)
    subtype: two burn resistors on one restraint line, hinge switch
    notes: "about 5 Ohm each (to be measured); the driver regulates 0.8 A for 4-6.9 Ohm"
    pinlabels: [R_W1A a, R_W1A b, R_W1B a, R_W1B b, SW_W1 in, SW_W1 out]
  J11:
    type: Molex Micro-Fit 3.0 header 0430450612
    subtype: 6 pos, 2 rows
    notes: "EPS J11, wing W2: drivers Q26 (W2A, BURN_W2A PB9) and Q27 (W2B, BURN_W2B PE7)"
    pinlabels: [V_BURN, BRET_W2A, V_BURN, BRET_W2B, SA_SENSE_MID, GND]
  WING2:
    type: wing W2 hold-down (bought with the panels)
    subtype: two burn resistors on one restraint line, hinge switch
    notes: closed when deployed
    pinlabels: [R_W2A a, R_W2A b, R_W2B a, R_W2B b, SW_W2 in, SW_W2 out]
  J12:
    type: Molex Pico-Clasp header 5013310407
    subtype: 4 pos
    notes: "EPS J12: AntS supply (SW8, DEPLOY_EN) and I2C (U80 B side)"
    pinlabels: [3V3_ANTS, GND, ANTS_SDA, ANTS_SCL]
  ANTS:
    type: ISIS AntS 1U-3U (bought)
    subtype: own controller, redundant thermal knives
    notes: "pinout from the AntS ICD (open)"
    pinlabels: [VCC 3V3, GND, SDA, SCL]

cables:
  W7A:
    category: bundle
    gauge: 24 AWG
    length: 0.12
    colors: [VT, BK, VT, BK, OG, OG]
    notes: "Burn pairs twisted; 0.88 A for ≤ 12 s on 24 AWG (1 A derated). Sense pair 28 AWG would do"
  W7B:
    category: bundle
    gauge: 24 AWG
    length: 0.15
    colors: [VT, BK, VT, BK, OG, BK]
    notes: "Length set with the wing layout"
  W7C:
    category: bundle
    gauge: 26 AWG
    length: 0.10
    colors: [RD, BK, BU, YE]
    notes: "AntS: 0.61 A peak at 3.3 V (below 2 W); I2C twisted with GND"

connections:
  - - J10: [1-6]
    - W7A: [1-6]
    - WING1: [1-6]
  - - J11: [1-6]
    - W7B: [1-6]
    - WING2: [1-6]
  - - J12: [1-4]
    - W7C: [1-4]
    - ANTS: [1-4]
