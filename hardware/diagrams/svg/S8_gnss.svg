<tspan x="5.3999999999999995" dy="8">RXD</tspan></text><text x="5.3999999999999995" y="-94.39999999999999" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="start"><tspan x="5.3999999999999995" dy="8">TXD</tspan></text><text x="196.2" y="-62.0" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="end"><tspan x="196.2" dy="8">RF_IN</tspan></text><text x="100.8" y="-110.60000000000001" dominant-baseline="hanging" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="100.8" dy="8">VIN</tspan></text><text x="100.8" y="-13.399999999999999" dominant-baseline="ideographic" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="100.8" dy="8">GND</tspan></text><text x="104.39999999999999" y="-75.6" dominant-baseline="central" fill="black" font-size="9" font-family="Helvetica" text-anchor="middle"><tspan x="104.39999999999999" dy="9">U1 GNSS receiver</tspan><tspan x="104.39999999999999" dy="9">pNAV-NG/FM (D6)</tspan><tspan x="104.39999999999999" dy="9">pinout per vendor ICD (TBD)</tspan></text><text x="14.759999999999998" y="-152.0" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="14.759999999999998" dy="8">3V3_GNSS (SW7, S2)</tspan></text><text x="126.0" y="-163.6" dominant-baseline="ideographic" fill="black" font-size="7" font-family="Helvetica" text-anchor="middle"><tspan x="126.0" dy="7">10 uF + 100 nF</tspan></text><text x="-46.800000000000004" y="-106.0" dominant-baseline="ideographic" fill="black" font-size="7" font-family="Helvetica" text-anchor="middle"><tspan x="-46.800000000000004" dy="7">1k</tspan></text><text x="-148.68" y="-94.39999999999999" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="-148.68" dy="8">UART4_RX* (PC11)</tspan></text><text x="-46.800000000000004" y="-73.60000000000001" dominant-baseline="ideographic" fill="black" font-size="7" font-family="Helvetica" text-anchor="middle"><tspan x="-46.800000000000004" dy="7">1k</tspan></text><text x="-148.68" y="-62.000000000000014" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="-148.68" dy="8">UART4_TX* (PC10)</tspan></text><text x="-46.800000000000004" y="-41.2" dominant-baseline="ideographic" fill="black" font-size="7" font-family="Helvetica" text-anchor="middle"><tspan x="-46.800000000000004" dy="7">1k</tspan></text><text x="-165.96" y="-29.60000000000002" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="-165.96" dy="8">PPS* (timer input TBD)</tspan></text><text x="251.99999999999997" y="-64.6" dominant-baseline="ideographic" fill="black" font-size="7" font-family="Helvetica" text-anchor="middle"><tspan x="251.99999999999997" dy="7">U.FL / MMCX (TBD)</tspan></text><text x="308.88" y="-86.10000000000001" dominant-baseline="central" fill="black" font-size="7" font-family="Helvetica" text-anchor="start"><tspan x="308.88" dy="7">L1 patch, active (TBD)</tspan><tspan x="308.88" dy="7">bias from the receiver</tspan></text><text x="-212.4" y="104.60000000000001" dominant-baseline="hanging" fill="#333333" font-size="7" font-family="Helvetica" text-anchor="start"><tspan x="-212.4" dy="7">Neither the firmware nor any ICD has a GNSS UART, enable or 1PPS (finding F2). Proposed: UART4 on PC10/PC11 (the pins</tspan><tspan x="-212.4" dy="7">of SPI3, which nothing uses), GNSS_EN on PE4 switching SW7 (S2), 1PPS to a timer input capture (pin TBD).</tspan><tspan x="-212.4" dy="7">The 1k series resistors limit back-power while SW7 is off (TBR; a translator as in S7 is the alternative).</tspan></text><circle cx="100.8" cy="-144" r="2.7" style="stroke:black;fill:black;stroke-width:1.1;stroke-dasharray:-;" /></svg>