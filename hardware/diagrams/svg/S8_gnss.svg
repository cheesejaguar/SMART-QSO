tica" text-anchor="end"><tspan x="163.79999999999998" dy="8">B</tspan></text><text x="39.6" y="11.799999999999994" dominant-baseline="hanging" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="39.6" dy="8">VCCA</tspan></text><text x="147.6" y="11.799999999999994" dominant-baseline="hanging" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="147.6" dy="8">VCCB</tspan></text><text x="97.2" y="26.1" dominant-baseline="central" fill="black" font-size="9" font-family="Helvetica" text-anchor="middle"><tspan x="97.2" dy="9">U31 SN74LVC1T45-Q1</tspan><tspan x="97.2" dy="9">B to A</tspan></text><text x="-106.2" y="35.19999999999999" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="-106.2" dy="8">LPUART1_RX (PG8, 100k up)</tspan></text><text x="36.0" y="-27.6" dominant-baseline="central" fill="black" font-size="6" font-family="Helvetica" text-anchor="end"><tspan x="36.0" dy="6">3V3_OBC</tspan></text><text x="143.99999999999997" y="-27.6" dominant-baseline="central" fill="black" font-size="6" font-family="Helvetica" text-anchor="end"><tspan x="143.99999999999997" dy="6">3V3_GNSS</tspan></text><text x="23.400000000000002" y="121.6" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="start"><tspan x="23.400000000000002" dy="8">A</tspan></text><text x="163.79999999999998" y="121.6" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="end"><tspan x="163.79999999999998" dy="8">B</tspan></text><text x="39.6" y="98.19999999999997" dominant-baseline="hanging" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="39.6" dy="8">VCCA</tspan></text><text x="147.6" y="98.19999999999997" dominant-baseline="hanging" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="147.6" dy="8">VCCB</tspan></text><text x="97.2" y="112.5" dominant-baseline="central" fill="black" font-size="9" font-family="Helvetica" text-anchor="middle"><tspan x="97.2" dy="9">U32 SN74LVC1T45-Q1</tspan><tspan x="97.2" dy="9">B to A</tspan></text><text x="-135.0" y="121.59999999999997" dominant-baseline="central" fill="black" font-size="8" font-family="Helvetica" text-anchor="middle"><tspan x="-135.0" dy="8">GNSS_PPS (PC6, TIM3_CH1, 100k down)</tspan></text><text x="36.0" y="58.8" dominant-baseline="central" fill="black" font-size="6" font-family="Helvetica" text-anchor="end"><tspan x="36.0" dy="6">3V3_OBC</tspan></text><text x="143.99999999999997" y="58.8" dominant-baseline="central" fill="black" font-size="6" font-family="Helvetica" text-anchor="end"><tspan x="143.99999999999997" dy="6">3V3_GNSS</tspan></text><text x="-286.41327009977675" y="222.1624088407827" dominant-baseline="hanging" fill="#333333" font-size="7" font-family="Helvetica" text-anchor="start"><tspan x="-286.41327009977675" dy="7">Each translator's receiver side (VCCB) is 3V3_GNSS and its OBC side (VCCA) 3V3_OBC: with GNSS_EN low or SW7 tripped</tspan><tspan x="-286.41327009977675" dy="7">(0.175-0.232 A latch-up limit, 1.3 s off), the UART and 1PPS lines are high-impedance on the receiver side, so the OBC</tspan><tspan x="-286.41327009977675" dy="7">neither back-powers the receiver nor feeds a latch-up. GNSS_PG: 3V3_GNSS -&gt; 10k -&gt; PG15 (100k down) shows a trip.</tspan><tspan x="-286.41327009977675" dy="7">10 uF + 100 nF at J5. ESD: TPD4E05U06-Q1 at J5.</tspan></text><circle cx="604.8" cy="-147.6" r="2.7" style="stroke:black;fill:black;stroke-width:1.1;stroke-dasharray:-;" /></svg>