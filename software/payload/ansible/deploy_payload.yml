---
- name: Deploy SMART-QSO payload agent to Jetson
  hosts: jetson
  become: false
  vars:
    repo_src: "{{ playbook_dir }}/../../.."
    dest_dir: "~/smart-qso"
    venv_dir: "{{ dest_dir }}/.venv"
    payload_dir: "{{ ansible_env.HOME }}/smart-qso/software/payload"
  tasks:
    - name: Ensure destination directory exists
      ansible.builtin.file:
        path: "{{ dest_dir }}"
        state: directory

    - name: Rsync payload code
      ansible.builtin.synchronize:
        src: "{{ repo_src }}/software/payload/"
        dest: "{{ dest_dir }}/software/payload/"
        rsync_opts:
          - "--delete"

    - name: Rsync the Rust wire-format crates (built into the sqso_protocol module)
      ansible.builtin.synchronize:
        src: "{{ repo_src }}/software/rust/"
        dest: "{{ dest_dir }}/software/rust/"
        rsync_opts:
          - "--delete"
          - "--exclude=target"
          - "--exclude=fuzz"

    - name: Create Python venv
      ansible.builtin.command: python3 -m venv {{ venv_dir }}
      args:
        creates: "{{ venv_dir }}/bin/activate"

    - name: Install Rust (pinned by software/rust/rust-toolchain.toml)
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      args:
        creates: "~/.cargo/bin/rustup"

    - name: Build and install sqso_protocol (the OBC's wire formats for the agent)
      ansible.builtin.shell: |
        source {{ venv_dir }}/bin/activate
        source ~/.cargo/env
        pip install --upgrade pip
        pip install {{ dest_dir }}/software/rust/sqso-py
        pip install -e {{ dest_dir }}/software/payload
      args:
        executable: /bin/bash

    - name: Install llama-cpp-python (GPU build optional)
      ansible.builtin.shell: |
        source {{ venv_dir }}/bin/activate
        pip install --upgrade pip
        pip install llama-cpp-python

    # RID JETB-01: the 6.5 W VDD_IN cap and the 7 W mode at every boot
    # (platform_config.py; the image itself is built with
    # "platform_config.py image <Linux_for_Tegra>": board configuration
    # without the carrier EEPROM, PCIe C4 Gen2 x1 overlay, nvpmodel default ID 1)
    - name: Install the platform configuration service
      become: true
      ansible.builtin.template:
        src: "{{ repo_src }}/software/payload/config/sqso-platform.service.j2"
        dest: /etc/systemd/system/sqso-platform.service
        mode: "0644"

    - name: Enable and run the platform configuration
      become: true
      ansible.builtin.systemd:
        name: sqso-platform.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Create run script
      ansible.builtin.copy:
        dest: "{{ dest_dir }}/run_payload.sh"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          systemctl is-active --quiet sqso-platform.service || {
            echo "sqso-platform.service not active: the 6.5 W cap is not set" >&2; exit 1; }
          source "{{ venv_dir }}/bin/activate"
          export LLAMA_MODEL="${LLAMA_MODEL:-/models/SmolLM2-360M-Instruct-Q4_K_M.gguf}"
          exec python -m software.payload.agent


