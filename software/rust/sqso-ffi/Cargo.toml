[package]
name = "sqso-ffi"
description = "C ABI of the SMART-QSO Rust modules, linked into the C flight software"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sqso_ffi"
crate-type = ["staticlib"]
# Exercised through the C test suite (ctest), which links this library
test = false
doctest = false

[dependencies]
sqso-protocol.workspace = true
sqso-fsw.workspace = true
sha2.workspace = true
zeroize.workspace = true

# The host simulation's operating-system calls (clock, files, environment,
# console, serial port). Not used on the target (target_os = "none").
[target.'cfg(not(target_os = "none"))'.dependencies]
libc.workspace = true

[lints]
workspace = true
